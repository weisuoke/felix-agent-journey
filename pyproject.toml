[project]
name = "felix-agent-journey"
version = "0.1.0"
description = "AI Agent 工程师面试实战：知识库与审批工单"
requires-python = ">=3.13"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
felix-agent = "felix_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felix_agent"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
